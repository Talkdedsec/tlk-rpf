name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  denetim:
    name: Tip, lint, test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Bağımlılıklar
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Arayüz derlemesi
        run: npx vite build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Çekirdek testleri
        # Gerçek mod dosyası isteyen testler testdata/ boş olduğu için atlanır.
        run: cargo test -p tlk-rpf-core --locked
